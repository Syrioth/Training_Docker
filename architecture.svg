<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: bold; fill: #38bdf8; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .box-host { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 6; }
      .box-net { fill: #111a2e; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6 4; rx: 10; }
      .box-container { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 6; }
      .box-head { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #f8fafc; }
      .box-text { font-family: 'Consolas', monospace; font-size: 12px; fill: #cbd5e1; }
      .badge-green { fill: #064e3b; stroke: #10b981; stroke-width: 1; rx: 4; }
      .badge-text { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: bold; fill: #34d399; }
      .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-dep { stroke: #10b981; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arrowhead-green); fill: none; }
      .flow-label { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #93c5fd; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <rect width="950" height="620" class="bg" />

  <text x="35" y="40" class="title">☁️ Architecture Docker Cloud — Hello World (Master 1)</text>
  <text x="35" y="62" class="subtitle">Ordonnancement séquentiel par Healthchecks • 0 image Docker Hub • Quotas cgroups</text>

  <!-- Machine Hôte -->
  <rect x="35" y="85" width="880" height="70" class="box-host" />
  <text x="50" y="112" class="box-head">🖥️ Machine Hôte</text>
  <text x="50" y="135" class="box-text">Navigateur Web : http://localhost:8080</text>

  <!-- Réseau Docker isolé -->
  <rect x="35" y="180" width="880" height="400" class="box-net" />
  <text x="50" y="205" class="box-head" fill="#60a5fa">🔗 Réseau Bridge Isolé : docker_cloud_net</text>

  <!-- Conteneur 1 : Front -->
  <g transform="translate(50, 225)">
    <rect width="260" height="320" class="box-container" />
    <text x="15" y="25" class="box-head">1. front-dashboard</text>
    <rect x="15" y="35" width="115" height="18" class="badge-green" />
    <text x="22" y="48" class="badge-text">STATUS: HEALTHY</text>
    <text x="15" y="75" class="box-text" fill="#93c5fd">Rôle : Web &amp; Dashboard</text>
    <text x="15" y="100" class="box-text">Port interne : 8080</text>
    <text x="15" y="120" class="box-text">Port hôte : 8080:8080</text>
    <text x="15" y="145" class="box-text" fill="#facc15">Ressources allouées :</text>
    <text x="15" y="165" class="box-text">• Max CPU : 0.25 core</text>
    <text x="15" y="185" class="box-text">• Max RAM : 64 Mo</text>
    <text x="15" y="215" class="box-text">User : frontuser (1003)</text>
    <text x="15" y="240" class="box-text" fill="#f87171">SIGTERM : Géré (PID 1)</text>
    <text x="15" y="265" class="box-text" fill="#4ade80">Dépend de : back (healthy)</text>
  </g>

  <!-- Conteneur 2 : Back -->
  <g transform="translate(345, 225)">
    <rect width="260" height="320" class="box-container" />
    <text x="15" y="25" class="box-head">2. back-api</text>
    <rect x="15" y="35" width="115" height="18" class="badge-green" />
    <text x="22" y="48" class="badge-text">STATUS: HEALTHY</text>
    <text x="15" y="75" class="box-text" fill="#93c5fd">Rôle : API Gateway</text>
    <text x="15" y="100" class="box-text">Port interne : 8081</text>
    <text x="15" y="120" class="box-text">Port hôte : 8081:8081</text>
    <text x="15" y="145" class="box-text" fill="#facc15">Ressources allouées :</text>
    <text x="15" y="165" class="box-text">• Max CPU : 0.50 core</text>
    <text x="15" y="185" class="box-text">• Max RAM : 128 Mo</text>
    <text x="15" y="215" class="box-text">User : backuser (1002)</text>
    <text x="15" y="240" class="box-text" fill="#f87171">SIGTERM : Géré (PID 1)</text>
    <text x="15" y="265" class="box-text" fill="#4ade80">Dépend de : game (healthy)</text>
  </g>

  <!-- Conteneur 3 : Game Server -->
  <g transform="translate(640, 225)">
    <rect width="260" height="320" class="box-container" />
    <text x="15" y="25" class="box-head">3. game-server</text>
    <rect x="15" y="35" width="115" height="18" class="badge-green" />
    <text x="22" y="48" class="badge-text">STATUS: HEALTHY</text>
    <text x="15" y="75" class="box-text" fill="#93c5fd">Rôle : Serveur Web Spécialisé</text>
    <text x="15" y="100" class="box-text">Port interne : 8082</text>
    <text x="15" y="120" class="box-text">Port hôte : 8082:8082</text>
    <text x="15" y="145" class="box-text" fill="#facc15">Ressources allouées :</text>
    <text x="15" y="165" class="box-text">• Max CPU : 0.50 core</text>
    <text x="15" y="185" class="box-text">• Max RAM : 128 Mo</text>
    <text x="15" y="215" class="box-text">User : gameuser (1001)</text>
    <text x="15" y="240" class="box-text" fill="#f87171">SIGTERM : Géré (PID 1)</text>
    <text x="15" y="265" class="box-text" fill="#4ade80">Ordre : Démarre en 1er</text>
  </g>

  <!-- Flèche Hôte -> Front -->
  <path d="M 180 155 L 180 225" class="arrow" />

  <!-- Communication interne Front -> Back -->
  <path d="M 310 330 L 345 330" class="arrow" />
  <text x="313" y="322" class="flow-label">HTTP</text>

  <!-- Communication interne Back -> Game -->
  <path d="M 605 330 L 640 330" class="arrow" />
  <text x="608" y="322" class="flow-label">HTTP</text>

  <!-- Flèche dépendance séquentielle -->
  <path d="M 640 500 L 605 500" class="arrow-dep" />
  <path d="M 345 500 L 310 500" class="arrow-dep" />
  <text x="475" y="585" class="badge-text" text-anchor="middle">🟩 Dépendance séquentielle : Game-Server (Healthy) ➔ Back-API (Healthy) ➔ Front-Dashboard</text>
</svg>
