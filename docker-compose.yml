# ==============================================================================
# PROJET DOCKER CLOUD - MASTER 1 INFORMATIQUE
# Architecture Virtualisée Multi-Conteneurs (Front Nginx + Back + Serveur Web)
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # 1. SERVEUR WEB SPÉCIALISÉ : game-server (Cœur de données)
  # Démarre en premier (1ère position). Fournit son service web Hello World.
  # ----------------------------------------------------------------------------
  game-server:
    build:
      context: ./game-server
      dockerfile: Dockerfile
      args:
        DEFAULT_PORT: 8082
    container_name: cloud_game_server
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    environment:
      - PORT=8082
      - SERVICE_NAME=game-web-server
      - PYTHONUNBUFFERED=1
    ports:
      - "${GAME_HOST_PORT:-8082}:8082"
    networks:
      - cloud-network
    deploy:
      resources:
        limits:
          cpus: '${GAME_CPU_LIMIT:-0.50}'
          memory: ${GAME_MEM_LIMIT:-128M}
        reservations:
          cpus: '0.10'
          memory: ${GAME_MEM_RESERVATION:-64M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  # ----------------------------------------------------------------------------
  # 2. BACK-END : back-api
  # Démarre en 2ème position dès que game-server est sain (healthy).
  # ----------------------------------------------------------------------------
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
      args:
        DEFAULT_PORT: 8081
    container_name: cloud_back_api
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    environment:
      - PORT=8081
      - SERVICE_NAME=backend-core-api
      - GAME_SERVER_URL=http://game-server:8082
      - PYTHONUNBUFFERED=1
    ports:
      - "${BACK_HOST_PORT:-8081}:8081"
    networks:
      - cloud-network
    depends_on:
      game-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${BACK_CPU_LIMIT:-0.50}'
          memory: ${BACK_MEM_LIMIT:-128M}
        reservations:
          cpus: '0.10'
          memory: ${BACK_MEM_RESERVATION:-64M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  # ----------------------------------------------------------------------------
  # 3. FRONT-END : front (Nginx Personnalisé & Reverse Proxy)
  # Démarre en 3ème position dès que back-api est sain (healthy).
  # ----------------------------------------------------------------------------
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: cloud_front_dashboard
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 10s
    ports:
      - "${FRONT_HOST_PORT:-8080}:8080"
    networks:
      - cloud-network
    depends_on:
      back:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${FRONT_CPU_LIMIT:-0.25}'
          memory: ${FRONT_MEM_LIMIT:-64M}
        reservations:
          cpus: '0.05'
          memory: ${FRONT_MEM_RESERVATION:-32M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

# ------------------------------------------------------------------------------
# Réseau isolé bridge
# ------------------------------------------------------------------------------
networks:
  cloud-network:
    driver: bridge
    name: docker_cloud_net
