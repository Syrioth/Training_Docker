# ==============================================================================
# Configuration Nginx personnalisée - Architecture Docker Cloud (Front-End)
# ==============================================================================

# Exécution en tâche de premier plan (obligatoire pour Docker PID 1)
daemon off;

# 1 processus worker par cœur CPU disponible
worker_processes auto;

# Gestion des fichiers PID et temporaires pour utilisateur non-root
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Répertoires temporaires accessibles en mode non-root (UID 1003)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Format de logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    # Configuration du serveur virtuel Front-End
    server {
        # Écoute sur le port non-privilégié 8080
        listen 8080;
        server_name localhost;

        # 1. Service des fichiers statiques Hello World
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Sonde de santé pour le HEALTHCHECK Docker
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"front-nginx"}\n';
            add_header Content-Type application/json;
        }

        # 3. Reverse Proxy vers l'API Back-End (Orchestration multi-conteneurs)
        # Redirige les requêtes /api/... directement vers le conteneur 'back' sur le port 8081
        location /api/ {
            proxy_pass http://back:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
